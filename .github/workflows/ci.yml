name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grit
          POSTGRES_PASSWORD: grit
          POSTGRES_DB: grit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U grit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database for migrations and the database tests
      DATABASE_URL: postgresql://grit:grit@localhost:5432/grit
      DIRECT_URL: postgresql://grit:grit@localhost:5432/grit
      SHADOW_DATABASE_URL: postgresql://grit:grit@localhost:5432/grit_shadow
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Apply migrations
        run: npx prisma migrate deploy
      - name: Check the schema matches the migrations
        run: |
          PGPASSWORD=grit psql -h localhost -U grit -d grit -c 'CREATE DATABASE grit_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - name: Format
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"
      - name: Lint
        run: npx eslint "src/**/*.ts"
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Database tests
        run: npm run test:db
      - name: Build
        run: npm run build && test -f dist/main.js

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: .
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests
        run: npm test -- --ci

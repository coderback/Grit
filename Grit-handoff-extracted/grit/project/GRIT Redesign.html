<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GRIT — Redesign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: #111214;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DM Sans', sans-serif;
    transition: background 0.3s ease;
  }
  ::-webkit-scrollbar { display: none; }

  .pill {
    padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-size: 12px; font-weight: 600; font-family: 'DM Sans', sans-serif;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #9A9498; transition: all 0.15s;
  }
  .pill.active { background: rgba(255,92,43,0.15); border-color: #FF5C2B; color: #FF5C2B; }

  .iphone {
    width: 390px; height: 820px;
    background: #0F0F0F; border-radius: 52px;
    border: 8px solid #2A2A2A;
    box-shadow: 0 0 0 1px #1A1A1A, inset 0 0 0 1px #3A3A3A,
      0 32px 80px rgba(0,0,0,0.7), 0 8px 24px rgba(0,0,0,0.4);
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .iphone::before {
    content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 34px; background: #2A2A2A;
    border-radius: 0 0 22px 22px; z-index: 200;
  }
  .iphone-inner { width: 100%; height: 100%; border-radius: 44px; overflow: hidden; position: relative; }

  #tweak-panel {
    position: fixed; bottom: 20px; right: 20px; z-index: 9999;
    background: #1A1A1C; border: 1px solid #2B2B30; border-radius: 18px;
    padding: 18px; width: 244px; display: none; flex-direction: column; gap: 14px;
    box-shadow: 0 12px 48px rgba(0,0,0,0.6);
  }
  #tweak-panel.visible { display: flex; }
  .tw-title { font-size: 11px; font-weight: 700; color: #9A9498; letter-spacing: 0.8px; text-transform: uppercase; font-family: 'DM Sans', sans-serif; }
  .tw-row { display: flex; flex-direction: column; gap: 7px; }
  .tw-label { font-size: 12px; color: #9A9498; font-family: 'DM Sans', sans-serif; }
  .tw-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .tw-btn { padding: 5px 11px; border-radius: 999px; border: 1px solid #2B2B30; background: #242428; color: #F5F0EB; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .tw-btn.active { background: rgba(255,92,43,0.15); border-color: #FF5C2B; color: #FF5C2B; }
</style>
</head>
<body>
<div id="root"></div>

<div id="tweak-panel">
  <div class="tw-title">Tweaks</div>
  <div class="tw-row">
    <div class="tw-label">Screen</div>
    <div class="tw-btns" id="tw-screens"></div>
  </div>
  <div class="tw-row">
    <div class="tw-label">Accent color</div>
    <div class="tw-btns" id="tw-accents"></div>
  </div>
  <div class="tw-row">
    <div class="tw-label">Theme</div>
    <div class="tw-btns" id="tw-mode"></div>
  </div>
</div>

<script type="text/babel" src="AppNav2.jsx"></script>
<script type="text/babel" src="Onboarding2.jsx"></script>
<script type="text/babel" src="HomeAnalytics.jsx"></script>
<script type="text/babel" src="AppScreens2.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "home",
  "accent": "#FF5C2B",
  "light": false
}/*EDITMODE-END*/;

const DARK_C  = { orange:'#FF5C2B', dark:'#0F0F0F', surface:'#1A1A1C', surface2:'#242428', surface3:'#2E2E33', text:'#F5F0EB', muted:'#9A9498', teal:'#00C8A0', blue:'#4B9FFF', border:'#2B2B30', error:'#FF453A' };
const LIGHT_C = { orange:'#FF5C2B', dark:'#F4F3F0', surface:'#FFFFFF', surface2:'#EEECEA', surface3:'#E4E2DE', text:'#18171A', muted:'#8A8784', teal:'#00A882', blue:'#2C7EE8', border:'#DDD9D4', error:'#D93025' };

function applyTheme(accent, isLight) {
  const base = isLight ? { ...LIGHT_C } : { ...DARK_C };
  base.orange = accent;
  Object.assign(window.C, base);
  document.body.style.background = isLight ? '#E5E3DE' : '#111214';
}

const ALL_SCREENS = ['onboarding','home','food','analytics','habits','social','profile'];
const ACCENT_OPTS = ['#FF5C2B','#00C8A0','#4B9FFF','#A78BFA'];
const ACCENT_NAMES = ['Orange','Teal','Blue','Purple'];

function App() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem('grit_v2')||'{}'); } catch { return {}; } })();
  const [tab, setTabRaw] = React.useState(saved.tab || TWEAK_DEFAULTS.screen);
  const [onbStep, setOnbStep] = React.useState(0);
  const [accent, setAccent] = React.useState(saved.accent || TWEAK_DEFAULTS.accent);
  const [light, setLight] = React.useState(saved.light ?? false);
  const setTab = (t) => { setTabRaw(t); if (t === 'onboarding') setOnbStep(0); };

  // Apply theme synchronously on every render so C is updated before children read it
  applyTheme(accent, light);

  React.useEffect(() => { localStorage.setItem('grit_v2', JSON.stringify({ tab, accent, light })); }, [tab, accent, light]);

  // Tweak panel wiring
  React.useEffect(() => {
    const sEl = document.getElementById('tw-screens');
    const aEl = document.getElementById('tw-accents');
    const mEl = document.getElementById('tw-mode');
    if (!sEl) return;

    sEl.innerHTML = ALL_SCREENS.map(s =>
      `<div class="tw-btn${tab===s?' active':''}" data-s="${s}">${s[0].toUpperCase()+s.slice(1)}</div>`
    ).join('');
    sEl.querySelectorAll('.tw-btn').forEach(b => b.addEventListener('click', () => setTab(b.dataset.s)));

    aEl.innerHTML = ACCENT_OPTS.map((a,i) =>
      `<div class="tw-btn${accent===a?' active':''}" data-a="${a}" style="background:${a}22;border-color:${accent===a?a:(light?'#DDD9D4':'#2B2B30')};color:${a}">${ACCENT_NAMES[i]}</div>`
    ).join('');
    aEl.querySelectorAll('.tw-btn').forEach(b => b.addEventListener('click', () => {
      setAccent(b.dataset.a);
      window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ accent:b.dataset.a } }, '*');
    }));

    if (mEl) {
      mEl.innerHTML = ['Dark','Light'].map(m =>
        `<div class="tw-btn${(m==='Light')===light?' active':''}" data-m="${m}">${m}</div>`
      ).join('');
      mEl.querySelectorAll('.tw-btn').forEach(b => b.addEventListener('click', () => {
        const isLight = b.dataset.m === 'Light';
        setLight(isLight);
        window.parent.postMessage({ type:'__edit_mode_set_keys', edits:{ light: isLight } }, '*');
      }));
    }
  });

  React.useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') document.getElementById('tweak-panel')?.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweak-panel')?.classList.remove('visible');
    });
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
  }, []);

  function renderScreen() {
    if (tab === 'onboarding') {
      if (onbStep === 0) return <OnboardingBasics2 onContinue={() => setOnbStep(1)} onBack={() => {}} />;
      if (onbStep === 1) return <OnboardingGoal2 onContinue={() => setOnbStep(2)} onBack={() => setOnbStep(0)} />;
      return <OnboardingReveal2 onFinish={() => { setOnbStep(0); setTab('home'); }} />;
    }
    return (
      <AppShell2 tab={tab} onTab={setTab}>
        {tab === 'home'      && <HomeScreen2 onNavigate={setTab} />}
        {tab === 'food'      && <FoodScreen2 />}
        {tab === 'analytics' && <AnalyticsScreen2 />}
        {tab === 'habits'    && <HabitsScreen2 />}
        {tab === 'social'    && <SocialScreen2 />}
        {tab === 'profile'   && <ProfileScreen2 />}
      </AppShell2>
    );
  }

  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:14, padding:'16px 20px', height:'100vh', justifyContent:'center' }}>
      {/* Screen pills */}
      <div style={{ display:'flex', gap:6, flexWrap:'wrap', justifyContent:'center' }}>
        {ALL_SCREENS.map(s => (
          <div key={s}
            className={`pill${tab===s?' active':''}`}
            onClick={() => setTab(s)}
            style={tab!==s && light ? { background:'rgba(0,0,0,0.06)', borderColor:'rgba(0,0,0,0.12)', color:'#8A8784' } : {}}
          >
            {s[0].toUpperCase()+s.slice(1)}
          </div>
        ))}
      </div>

      {/* iPhone */}
      <div className="iphone" style={{ background: light ? '#F4F3F0' : '#0F0F0F', borderColor: light ? '#C8C5BF' : '#2A2A2A' }}>
        <div className="iphone-inner" key={`${light}-${accent}`}>{renderScreen()}</div>
      </div>

      <div style={{ fontSize:11, color: light ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.18)', fontFamily:'DM Sans, sans-serif', letterSpacing:'0.4px' }}>
        GRIT v2 Redesign · click screens above or use Tweaks to navigate
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
